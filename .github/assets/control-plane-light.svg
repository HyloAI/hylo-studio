<title id="t">The studio control plane</title>
<desc id="d">The browser connects with a role (viewer, operator or approver; the e-stop is open to every role) to hylo playground, the control plane. It starts episodes on workcells, runs hylo commands as jobs, and reads runs and campaigns through the harness&#x27;s catalog. It never sends actions.</desc>
