<title id="t">The Hylo stack</title>
<desc id="d">Six layers, top to bottom, and the repositories that implement each: Workbench: studio; Evolution: harness · learn, evolve; Evaluation: bench, harness · eval; Cognition: harness · agents, memory; Runtime: serve, deployments-template; Kernel: harness · core, plugins. This repository: hylo-studio.</desc>
