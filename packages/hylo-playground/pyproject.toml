[project]
name = "hylo-playground"
version = "0.1.0.dev0"
description = "Hylo playground: a local web UI to explore runs, replay episodes, run live episodes, compare agents and inspect improvement campaigns"
requires-python = ">=3.10"
dependencies = ["hylo-core", "hylo-eval", "hylo-catalog", "fastapi>=0.110", "uvicorn>=0.29", "pillow>=10"]
license = "Apache-2.0"

[project.scripts]
hylo-playground = "hylo.playground.app:main"

[project.entry-points."hylo.commands"]
playground = "hylo.playground.app:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hylo"]

[tool.uv.sources]
hylo-core = { workspace = true }
hylo-eval = { workspace = true }
hylo-catalog = { workspace = true }
